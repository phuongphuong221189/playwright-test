name: Playwright Tests & Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions trên GitHub

# Cấp quyền để deploy lên GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout source code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Setup Java (bắt buộc cho Allure CLI) ─────────────────────────────
      - name: Setup Java 17 (required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install Allure CLI globally ───────────────────────────────────────
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # ── 5. Install project dependencies ─────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 6. Install Playwright browsers + OS dependencies ────────────────────
      - name: Install Playwright browsers & OS deps
        run: npx playwright install --with-deps chromium

      # ── 7. Load Allure history từ gh-pages (giữ Trend chart) ────────────────
      - name: Load Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # ── 8. Run Playwright tests với Allure reporter ──────────────────────────
      - name: Run Playwright tests (Allure reporter)
        run: npx playwright test --reporter=allure-playwright,line
        continue-on-error: true # Vẫn generate report dù có test fail

      # ── 9. Copy Allure history để giữ Trend chart ───────────────────────────
      - name: Copy Allure history for trend charts
        if: always()
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-report/history" ]; then
            cp -r gh-pages/allure-report/history allure-results/history
            echo "✅ Allure history copied successfully"
          else
            echo "⚠️ No previous history found — this is the first run"
          fi

      # ── 10. Generate Allure HTML Report ─────────────────────────────────────
      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      # ── 11. Upload Allure raw results as artifact ────────────────────────────
      - name: Upload Allure Results (raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results
          retention-days: 30

      # ── 12. Upload Allure HTML Report as artifact (xem trực tiếp) ───────────
      - name: Upload Allure HTML Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report
          retention-days: 30

      # ── 13. Deploy Allure Report lên GitHub Pages ───────────────────────────
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: allure-report
          keep_files: true

      # ── 14. In URL Allure Report ra console ─────────────────────────────────
      - name: Print Allure Report URL
        if: always()
        run: |
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo ""
          echo "=========================================="
          echo "📊 ALLURE REPORT (GitHub Pages):"
          echo "https://${REPO_OWNER}.github.io/${REPO_NAME}/allure-report"
          echo "=========================================="
          echo ""
          echo "📦 Artifacts (download từ Actions tab):"
          echo "  → allure-report-${{ github.run_number }}   (HTML Report)"
          echo "  → allure-results-${{ github.run_number }}  (Raw Results)"
